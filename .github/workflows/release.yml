name: Release Windows companion

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run pack:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Create checksums
        shell: pwsh
        run: Get-ChildItem dist -File -Filter '*.exe' | ForEach-Object { "$(Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName | Select-Object -ExpandProperty Hash)  $($_.Name)" } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
